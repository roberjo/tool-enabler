version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Skip releases younger than 5 days; compromised versions are usually yanked by then.
    # Security updates ignore cooldown.
    cooldown:
      default-days: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
